<style>
  /* Huisstijl GOC Consultants (website): Josefin Slab + PT Sans, donkerblauw, lichtblauw, ijsblauw */
  :root {
    --navy: #142A5B; --navy-2: #0C1C40; --lichtblauw: #83CDDB; --ijs: #E7F3F7; --magenta: #911D7C;
    --tekst: #555A63; --muted: #676767; --line: #D9E3E8; --wit: #FFFFFF;
    --fout: #A3262A; --fout-bg: #FBEDED;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--wit); color: var(--tekst); font-family: "PT Sans", Arial, sans-serif; font-size: 18px; line-height: 1.65; }
  h1, h2, h3 { font-family: "Josefin Slab", Georgia, serif; color: var(--navy); font-weight: 700; margin: 0; line-height: 1.2; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--navy); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }

  .topbalk { background: var(--ijs); font-size: 14px; }
  .topbalk .wrap { display: flex; justify-content: space-between; gap: 16px; padding-top: 8px; padding-bottom: 8px; }
  .topbalk .projectnaam { font-family: "Josefin Slab", Georgia, serif; font-weight: 700; color: var(--navy); }
  .topbalk a { font-family: "Josefin Slab", Georgia, serif; font-weight: 600; text-decoration: none; }
  header.kop { background: var(--wit); box-shadow: 0 2px 14px rgba(20, 42, 91, .08); position: relative; z-index: 2; }
  .kop .wrap { padding-top: 20px; padding-bottom: 20px; }
  .kop img { height: 58px; width: auto; display: block; }

  .voortgang { position: sticky; top: 0; z-index: 10; background: var(--wit); border-bottom: 1px solid var(--line); padding: 12px 0 10px; }
  .voortgang .balk { height: 4px; background: var(--ijs); overflow: hidden; }
  .voortgang .vul { height: 100%; background: var(--navy); width: 0; transition: width .3s ease; }
  .voortgang .tekst { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: 6px; gap: 12px; }
  .bewaard { white-space: nowrap; color: #2F6B57; }

  main { padding: 36px 0 72px; }

  /* Paginakop: ijsblauw vlak met lichtblauwe lijn, zoals op de website */
  .kaart.titel { background: var(--ijs); border-left: 4px solid var(--lichtblauw); padding: 26px 28px; margin-bottom: 8px; }
  .kaart.titel h1 { font-size: 40px; margin-bottom: 16px; }
  .kaart.titel h2 { font-size: 30px; }
  .kaart.titel .uitleg { color: var(--tekst); font-size: 17px; margin-top: 8px; }

  /* Startscherm met gekantelde vlakken */
  .start { position: relative; background: var(--ijs); border-left: 0; padding: 44px 32px 36px; overflow: hidden; margin-bottom: 28px; }
  .label-vlak { position: relative; display: inline-block; margin: 0 0 26px 6px; }
  .label-vlak::before { content: ""; position: absolute; inset: 6px -10px -8px 8px; background: var(--navy); transform: rotate(-3deg) skewX(-6deg); }
  .label-vlak span { position: relative; display: block; background: var(--lichtblauw); color: var(--navy); font-family: "Josefin Slab", Georgia, serif; font-weight: 700; font-size: 17px; padding: 10px 20px; transform: rotate(-2deg); }
  .start .alinea { color: var(--tekst); }
  .vertrouwelijk { background: var(--wit); border-left: 4px solid var(--lichtblauw); padding: 16px 20px; font-size: 16px; white-space: pre-line; margin: 20px 0 6px; }

  /* Vragen: open blokken met scheidingslijn */
  .kaart { padding: 28px 0; border-bottom: 1px solid var(--line); }
  .kaart.heeft-fout { border-left: 4px solid var(--fout); padding-left: 16px; }
  .uitleg { color: var(--muted); font-size: 16px; margin: 4px 0 0; }
  .alinea { margin: 0 0 14px; white-space: pre-line; }
  .testbanner { background: #FFF4D6; border-left: 4px solid #E0B341; color: #5A4300; padding: 10px 14px; font-size: 15px; margin-bottom: 20px; }
  .melding { padding: 12px 16px; font-size: 16px; margin: 14px 0 0; border-left: 4px solid; }
  .melding.fout { background: var(--fout-bg); color: var(--fout); }
  .melding.info { background: var(--wit); color: var(--navy); border-color: var(--lichtblauw); }

  .vraag { border: 0; margin: 0; padding: 0; min-width: 0; }
  .vraagtitel { font-weight: 700; color: var(--navy); font-size: 19px; padding: 0; display: block; line-height: 1.4; }
  .verplicht { color: var(--magenta); margin-left: 4px; }
  .keuzes { display: grid; gap: 8px; margin-top: 14px; }
  .keuze { display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; background: var(--wit); transition: border-color .15s, background .15s; }
  .keuze:hover { border-color: var(--lichtblauw); background: #F5FAFC; }
  .keuze input { margin: 5px 0 0; accent-color: var(--navy); width: 18px; height: 18px; flex: 0 0 auto; }
  .keuze:has(input:checked) { border-color: var(--navy); background: var(--ijs); color: var(--navy); }
  .keuze span { flex: 1; }
  .anders-tekst { margin-top: 8px; width: 100%; }
  input[type=text], select, textarea { width: 100%; border: 1px solid #A9B7C2; border-radius: 4px; padding: 11px 12px; background: var(--wit); }
  textarea { min-height: 130px; resize: vertical; }
  input[type=text]:focus, select:focus, textarea:focus, .keuze:has(input:focus-visible), .pil:has(input:focus-visible) { outline: 3px solid var(--lichtblauw); outline-offset: 1px; }
  select { margin-top: 14px; }
  .veld { margin-top: 14px; }

  .raster { margin-top: 16px; display: grid; gap: 10px; }
  .rij { border: 0; border-left: 3px solid var(--ijs); padding: 6px 0 8px 14px; margin: 0; }
  .rij legend { padding: 0; color: var(--tekst); font-size: 17px; float: left; width: 100%; }
  .pillen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; clear: both; padding-top: 4px; }
  .pil { position: relative; }
  .pil input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .pil span { display: block; border: 1px solid #A9B7C2; border-radius: 4px; padding: 7px 14px; font-size: 15px; background: var(--wit); cursor: pointer; line-height: 1.35; }
  .pil:hover span { border-color: var(--lichtblauw); }
  .pil input:checked + span { background: var(--navy); border-color: var(--navy); color: var(--wit); }
  .rij:has(input:checked) { border-left-color: var(--lichtblauw); }
  .rij.ontbreekt { border-left-color: var(--fout); background: var(--fout-bg); }

  .foutmelding { color: var(--fout); font-size: 15px; margin-top: 8px; }
  .foutmelding:empty { display: none; }

  /* Knoppen zoals op de website: streepje ervoor */
  .knoppen { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .knop { display: inline-flex; align-items: center; gap: 14px; border: 0; background: transparent; color: var(--navy); font-family: "Josefin Slab", Georgia, serif; font-weight: 700; font-size: 17px; padding: 14px 6px; cursor: pointer; min-height: 48px; border-radius: 4px; }
  .knop::before { content: ""; width: 26px; height: 1px; background: currentColor; transition: width .2s; }
  .knop:hover::before { width: 38px; }
  .knop.hoofd { background: var(--navy); color: var(--wit); padding: 14px 26px; }
  .knop.hoofd:hover { background: var(--navy-2); }
  .knop.link { padding: 6px 0; min-height: auto; font-size: 16px; }
  .knop.link::before { width: 16px; }
  .knop:disabled { opacity: .55; cursor: default; }
  .knop:focus-visible { outline: 3px solid var(--lichtblauw); outline-offset: 2px; }

  .overzicht h3 { font-size: 22px; }
  .overzicht .sectiekop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .overzicht dl { margin: 10px 0 0; }
  .overzicht dt { font-weight: 700; color: var(--navy); font-size: 16px; margin-top: 12px; }
  .overzicht dd { margin: 2px 0 0; white-space: pre-line; }
  .overzicht .leeg { color: var(--muted); font-style: italic; }

  footer { background: var(--navy); color: #DCE6F2; font-size: 15px; }
  footer .wrap { padding-top: 26px; padding-bottom: 30px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer strong { font-family: "Josefin Slab", Georgia, serif; color: var(--wit); font-size: 18px; }
  footer a { color: var(--lichtblauw); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 600px) {
    body { font-size: 17px; }
    .kaart.titel { padding: 20px 18px; }
    .kaart.titel h1 { font-size: 31px; }
    .kaart.titel h2 { font-size: 25px; }
    .start { padding: 32px 18px 26px; }
    .kop img { height: 46px; }
    .topbalk .contact { display: none; }
    .knoppen { flex-direction: column-reverse; align-items: stretch; }
    .knop { justify-content: center; }
  }
</style>

  PAGINAS[PAGINAS.length - 1].items.push(it);
});
const PAGINA_INDEX = Object.fromEntries(PAGINAS.map((p, i) => [p.key, i]));

// Route: welke pagina's ziet deze invuller, gegeven de antwoorden tot nu toe
function route() {
  const r = []; let i = 0; const gezien = new Set();
  while (i < PAGINAS.length && !gezien.has(i)) {
    gezien.add(i); r.push(i);
    let volgende = i + 1;
    PAGINAS[i].items.forEach(it => {
      if (it.naar) { const k = it.keuzes.indexOf(S.a[it.code]); if (k >= 0) volgende = PAGINA_INDEX[it.naar[k]]; }
    });
    i = volgende;
  }
  return r;
}

// ===== Hulpfuncties =====
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(k => { if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : document.createTextNode(k)); });
  return e;
}
let bewaarTimer;
function bewaar() {
  const ok = opslagSchrijven();
  const b = document.getElementById('bewaard');
  clearTimeout(bewaarTimer);
  b.textContent = ok ? 'Tussentijds bewaard op dit apparaat' : '';
  bewaarTimer = setTimeout(() => { b.textContent = ''; }, 2500);
}
function zet(sleutel, waarde) { S.a[sleutel] = waarde; bewaar(); }
function leeg(w) { return w === undefined || w === null || (typeof w === 'string' && !w.trim()) || (Array.isArray(w) && !w.length); }
const ANDERS = 'Anders, namelijk';

// ===== Vragen tekenen =====
function vraagKaart(it) {
  const id = 'q-' + it.code.replace(/\W/g, '_');
  const kaart = el('div', { class: 'kaart', id: id + '-kaart' });
  const titel = [it.titel, it.verplicht ? el('span', { class: 'verplicht', 'aria-hidden': 'true', text: '*' }) : null, it.verplicht ? el('span', { class: 'sr', text: '(verplicht)' }) : null];
  const uitleg = it.uitleg ? el('p', { class: 'uitleg', id: id + '-uitleg', text: it.uitleg }) : null;
  const fout = el('div', { class: 'foutmelding', id: id + '-fout', 'aria-live': 'polite' });
  let veld;

  if (it.type === 'lijst') {
    const sel = el('select', { id, 'aria-describedby': uitleg ? id + '-uitleg' : null, onchange: e => zet(it.code, e.target.value) },
      el('option', { value: '', text: 'Kies…' }), it.keuzes.map(k => el('option', { value: k, text: k, selected: S.a[it.code] === k })));
    kaart.append(el('label', { class: 'vraagtitel', for: id }, titel), uitleg, sel, fout);
    return kaart;
  }
  if (it.type === 'alinea' || it.type === 'kort') {
    veld = it.type === 'alinea'
      ? el('textarea', { id, rows: 5, maxlength: 4000, 'aria-describedby': uitleg ? id + '-uitleg' : null, oninput: e => zet(it.code, e.target.value) })
      : el('input', { id, type: 'text', maxlength: 500, 'aria-describedby': uitleg ? id + '-uitleg' : null, oninput: e => zet(it.code, e.target.value) });
    veld.value = S.a[it.code] || '';
    kaart.append(el('label', { class: 'vraagtitel', for: id }, titel), uitleg, el('div', { class: 'veld' }, veld), fout);
    return kaart;
  }
  if (it.type === 'mk' || it.type === 'cb') {
    const multi = it.type === 'cb';
    const fs = el('fieldset', { class: 'vraag', 'aria-describedby': uitleg ? id + '-uitleg' : null });
    fs.append(el('legend', { class: 'vraagtitel' }, titel), uitleg);
    const huidig = S.a[it.code];
    const keuzes = it.keuzes.concat(it.anders ? [ANDERS] : []);
    const andersVeld = it.anders ? el('input', { type: 'text', class: 'anders-tekst', maxlength: 300, 'aria-label': 'Anders, namelijk', value: S.a[it.code + '_anders'] || '',
      oninput: e => zet(it.code + '_anders', e.target.value) }) : null;
    const lijst = el('div', { class: 'keuzes' });
    keuzes.forEach((k, i) => {
      const gekozen = multi ? (huidig || []).includes(k) : huidig === k;
      const inp = el('input', { type: multi ? 'checkbox' : 'radio', name: id, value: k, checked: gekozen, onchange: () => {
        if (multi) { const lijstWaarden = Array.from(fs.querySelectorAll('input[type=checkbox]:checked')).map(x => x.value); zet(it.code, lijstWaarden); }
        else zet(it.code, k);
        if (andersVeld) andersVeld.hidden = multi ? !(S.a[it.code] || []).includes(ANDERS) : S.a[it.code] !== ANDERS;
        if (it.naar) toonVoortgang();
      } });
      lijst.append(el('label', { class: 'keuze' }, inp, el('span', { text: k })));
    });
    fs.append(lijst);
    if (andersVeld) { andersVeld.hidden = multi ? !(huidig || []).includes(ANDERS) : huidig !== ANDERS; fs.append(andersVeld); }
    kaart.append(fs, fout);
    return kaart;
  }
  if (it.type === 'raster') {
    const fs = el('fieldset', { class: 'vraag', 'aria-describedby': uitleg ? id + '-uitleg' : null });
    fs.append(el('legend', { class: 'vraagtitel' }, titel), uitleg);
    const raster = el('div', { class: 'raster' });
    it.rijen.forEach((rij, r) => {
      const sleutel = it.code + '.' + (r + 1);
      const rfs = el('fieldset', { class: 'rij', id: id + '-rij' + (r + 1) }, el('legend', { text: rij }));
      const pillen = el('div', { class: 'pillen' });
      it.kolommen.forEach(k => {
        pillen.append(el('label', { class: 'pil' }, el('input', { type: 'radio', name: id + '-' + r, value: k, checked: S.a[sleutel] === k,
          onchange: () => { zet(sleutel, k); rfs.classList.remove('ontbreekt'); } }), el('span', { text: k })));
      });
      rfs.append(pillen); raster.append(rfs);
    });
    fs.append(raster);
    kaart.append(fs, fout);
    return kaart;
  }
  return el('div');
}

// ===== Controle =====
function controleer(pag) {
  let eerste = null;
  pag.items.forEach(it => {
    const kaart = document.getElementById('q-' + it.code.replace(/\W/g, '_') + '-kaart');
    const fout = kaart && kaart.querySelector('.foutmelding');
    let melding = '';
    if (it.type === 'raster') {
      const missend = it.rijen.map((_, r) => r).filter(r => leeg(S.a[it.code + '.' + (r + 1)]));
      missend.forEach(r => document.getElementById('q-' + it.code.replace(/\W/g, '_') + '-rij' + (r + 1)).classList.add('ontbreekt'));
      if (it.verplicht && missend.length) melding = missend.length === 1 ? 'Kies bij de gemarkeerde rij een antwoord.' : 'Kies bij elke gemarkeerde rij een antwoord.';
    } else if (it.verplicht && leeg(S.a[it.code])) {
      melding = 'Deze vraag is verplicht.';
    }
    if (!melding && it.anders) {
      const w = S.a[it.code];
      const andersGekozen = Array.isArray(w) ? w.includes(ANDERS) : w === ANDERS;
      if (andersGekozen && leeg(S.a[it.code + '_anders'])) melding = 'Vul in wat je bedoelt met "Anders".';
    }
    if (fout) fout.textContent = melding;
    if (kaart) kaart.classList.toggle('heeft-fout', !!melding);
    if (melding && !eerste) eerste = kaart;
  });
  if (eerste) { eerste.scrollIntoView({ behavior: 'smooth', block: 'center' }); const f = eerste.querySelector('input, select, textarea'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 300); }
  return !eerste;
}

// ===== Antwoorden zoals ze worden verzonden =====
function zichtbareAntwoorden() {
  const uit = {};
  route().forEach(pi => PAGINAS[pi].items.forEach(it => {
    if (it.type === 'raster') it.rijen.forEach((_, r) => { const k = it.code + '.' + (r + 1); if (!leeg(S.a[k])) uit[k] = S.a[k]; });
    else {
      if (!leeg(S.a[it.code])) uit[it.code] = S.a[it.code];
      const w = S.a[it.code];
      if (it.anders && (Array.isArray(w) ? w.includes(ANDERS) : w === ANDERS) && !leeg(S.a[it.code + '_anders'])) uit[it.code + '_anders'] = S.a[it.code + '_anders'];
    }
  }));
  return uit;
}
function weergave(it) {
  if (it.type === 'raster') return it.rijen.map((rij, r) => rij + ': ' + (S.a[it.code + '.' + (r + 1)] || '—')).join('\n');
  let w = S.a[it.code];
  if (leeg(w)) return null;
  if (Array.isArray(w)) w = w.map(x => x === ANDERS ? 'Anders: ' + (S.a[it.code + '_anders'] || '') : x).join('\n');
  else if (w === ANDERS) w = 'Anders: ' + (S.a[it.code + '_anders'] || '');
  return w;
}

// ===== Schermen =====
function toonVoortgang() {
  const r = route();
  const bar = document.getElementById('voortgang');
  if (S.scherm !== 'vraag' && S.scherm !== 'overzicht') { bar.hidden = true; return; }
  bar.hidden = false;
  const totaal = r.length + 1;
  const stap = S.scherm === 'overzicht' ? totaal : r.indexOf(S.pagina) + 1;
  const pct = Math.round((stap - 1) / totaal * 100);
  document.getElementById('vul').style.width = pct + '%';
  bar.querySelector('[role=progressbar]').setAttribute('aria-valuenow', pct);
  document.getElementById('stapnaam').textContent = S.scherm === 'overzicht' ? 'Controleren en verzenden' : 'Stap ' + stap + ' van ' + totaal + ' · ' + (PAGINAS[S.pagina].titel || '');
}

function naar(scherm, pagina) {
  S.scherm = scherm; if (pagina !== undefined) S.pagina = pagina;
  bewaar(); teken();
  window.scrollTo({ top: 0 });
  $app.focus({ preventScroll: true });
}

function teken() {
  $app.replaceChildren();
  if (TEST) $app.append(el('div', { class: 'testbanner', text: 'Testmodus: antwoorden worden als TEST opgeslagen en kunnen weer worden verwijderd.' }));
  if (VERSIE === 'l') document.getElementById('koplabel').textContent = 'Functieanalyse docenten · perspectief leidinggevenden';
  if (S.scherm === 'start') tekenStart();
  else if (S.scherm === 'vraag') tekenPagina();
  else if (S.scherm === 'overzicht') tekenOverzicht();
  else if (S.scherm === 'klaar') tekenKlaar();
  toonVoortgang();
}

function tekenStart() {
  const heeftConcept = Object.keys(S.a).length > 0 && !S.verzonden;
  const kaart = el('div', { class: 'kaart titel start' },
    el('div', { class: 'label-vlak' }, el('span', { text: VERSIE === 'l' ? 'Perspectief leidinggevenden' : 'Functieanalyse docenten' })),
    el('h1', { text: V.titel }),
    V.inleiding.split('\n\n').map(p => el('p', { class: 'alinea', text: p })),
    el('div', { class: 'vertrouwelijk', text: V.vertrouwelijkheid })
  );
  const knoppen = el('div', { class: 'knoppen' });
  const dicht = openStatus === false && !TEST;
  if (dicht) kaart.append(el('div', { class: 'melding info', text: 'Deze vragenlijst is nog niet geopend. Je kunt hem bekijken, maar nog niet verzenden.' }));
  knoppen.append(el('button', { class: 'knop hoofd', type: 'button', text: heeftConcept ? 'Verder waar je was' : 'Start de vragenlijst', onclick: () => naar('vraag', heeftConcept ? S.pagina : route()[0]) }));
  if (heeftConcept) knoppen.append(el('button', { class: 'knop', type: 'button', text: 'Opnieuw beginnen', onclick: () => {
    if (confirmLeeg()) { S = { id: nieuwId(), a: {}, scherm: 'start', pagina: 0, verzonden: false }; bewaar(); teken(); } } }));
  kaart.append(el('p', { class: 'uitleg', text: 'Je antwoorden worden tussentijds bewaard op dit apparaat, zodat je later verder kunt. Pas als je op "Verzenden" klikt, gaan ze naar GOC Consultants.' }), knoppen);
  $app.append(kaart);
}
function confirmLeeg() { return window.confirm('Weet je zeker dat je opnieuw wilt beginnen? Je ingevulde antwoorden op dit apparaat worden gewist.'); }

function tekenPagina() {
  const r = route();
  if (!r.includes(S.pagina)) S.pagina = r[r.length - 1];
  const pag = PAGINAS[S.pagina];
  $app.append(el('div', { class: 'kaart titel' }, el('h2', { text: pag.titel }), pag.uitleg ? el('p', { class: 'uitleg', text: pag.uitleg }) : null));
  pag.items.forEach(it => $app.append(vraagKaart(it)));
  const pos = r.indexOf(S.pagina);
  const knoppen = el('div', { class: 'knoppen' });
  knoppen.append(el('button', { class: 'knop', type: 'button', text: pos === 0 ? 'Terug naar uitleg' : 'Vorige', onclick: () => pos === 0 ? naar('start') : naar('vraag', r[pos - 1]) }));
  knoppen.append(el('button', { class: 'knop hoofd', type: 'button', text: 'Volgende', onclick: () => {
    if (!controleer(pag)) return;
    const r2 = route(); const p2 = r2.indexOf(S.pagina);
    if (p2 === r2.length - 1) naar('overzicht'); else naar('vraag', r2[p2 + 1]);
  } }));
  $app.append(knoppen);
}

function tekenOverzicht() {
  const r = route();
  $app.append(el('div', { class: 'kaart titel' }, el('h2', { text: 'Controleer je antwoorden' }),
    el('p', { class: 'uitleg', text: 'Klopt alles? Je kunt per onderdeel nog iets wijzigen. Daarna verzend je je antwoorden.' })));
  r.forEach(pi => {
    const pag = PAGINAS[pi];
    const dl = el('dl');
    pag.items.forEach(it => {
      if (it.naar) return; // vertakkingsvragen niet herhalen
      const w = weergave(it);
      dl.append(el('dt', { text: it.titel }), el('dd', { class: w ? '' : 'leeg', text: w || 'Niet ingevuld' }));
    });
    $app.append(el('div', { class: 'kaart overzicht' },
      el('div', { class: 'sectiekop' }, el('h3', { text: pag.titel }),
        el('button', { class: 'knop link', type: 'button', text: 'Wijzigen', 'aria-label': 'Wijzig ' + pag.titel, onclick: () => naar('vraag', pi) })),
      dl));
  });
  const melding = el('div', { 'aria-live': 'polite' });
  const verzend = el('button', { class: 'knop hoofd', type: 'button', text: S.verzonden ? 'Wijzigingen verzenden' : 'Verzenden', onclick: () => verzenden(verzend, melding) });
  $app.append(el('div', { class: 'knoppen' },
    el('button', { class: 'knop', type: 'button', text: 'Vorige', onclick: () => naar('vraag', r[r.length - 1]) }), verzend), melding);
}

async function verzenden(knop, melding) {
  melding.replaceChildren();
  if (!API_URL) { melding.append(el('div', { class: 'melding fout', text: 'Deze pagina is nog niet gekoppeld aan de opslag. Verzenden kan nog niet.' })); return; }
  knop.disabled = true; knop.textContent = 'Bezig met verzenden…';
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ versie: VERSIE, id: S.id, test: TEST, antwoorden: zichtbareAntwoorden() }) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.fout || 'Onbekende fout');
    S.verzonden = true; naar('klaar');
  } catch (e) {
    knop.disabled = false; knop.textContent = S.verzonden ? 'Wijzigingen verzenden' : 'Verzenden';
    melding.append(el('div', { class: 'melding fout', text: 'Verzenden is niet gelukt: ' + e.message + ' Je antwoorden blijven bewaard op dit apparaat. Probeer het later opnieuw.' }));
  }
}

function tekenKlaar() {
  $app.append(el('div', { class: 'kaart titel' },
    el('h1', { text: 'Bedankt!' }),
    V.bevestiging.split('\n\n').slice(0, 1).map(p => el('p', { class: 'alinea', text: p })),
    el('p', { class: 'alinea', text: VERSIE === 'l'
      ? 'Wil je de vragenlijst ook voor een andere functie invullen? Kies dan "Nog een functie invullen".'
      : 'Wil je later nog iets aanpassen? Open deze pagina dan opnieuw op dit apparaat en kies "Antwoorden aanpassen".' }),
    el('div', { class: 'knoppen' },
      el('button', { class: 'knop', type: 'button', text: 'Antwoorden aanpassen', onclick: () => naar('overzicht') }),
      VERSIE === 'l' ? el('button', { class: 'knop hoofd', type: 'button', text: 'Nog een functie invullen', onclick: () => { S = { id: nieuwId(), a: {}, scherm: 'vraag', pagina: route()[0], verzonden: false }; bewaar(); teken(); } }) : null),
    el('p', { class: 'uitleg' }, 'Gebruik je een gedeelde computer? ',
      el('button', { class: 'knop link', type: 'button', text: 'Wis je antwoorden van dit apparaat', onclick: () => { opslagWissen(); S = { id: nieuwId(), a: {}, scherm: 'start', pagina: 0, verzonden: false }; teken(); } }))
  ));
}

// ===== Start =====
if (S.scherm === 'klaar' && !S.verzonden) S.scherm = 'start';
teken();
if (API_URL) fetch(API_URL).then(r => r.json()).then(d => { openStatus = !!d.open; if (S.scherm === 'start') teken(); }).catch(() => {});
</script>
