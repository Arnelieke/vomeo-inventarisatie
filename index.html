  /* Huisstijl GOC Consultants (website): Josefin Slab + PT Sans, donkerblauw, lichtblauw, ijsblauw */
  :root {
    --navy: #142A5B; --navy-2: #0C1C40; --lichtblauw: #83CDDB; --ijs: #E7F3F7; --magenta: #911D7C;
    --tekst: #555A63; --muted: #676767; --line: #D9E3E8; --wit: #FFFFFF; --zebra: #F6FAFC;
    --fout: #A3262A; --fout-bg: #FBEDED;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--wit); color: var(--tekst); font-family: "PT Sans", Arial, sans-serif; font-size: 18px; line-height: 1.65; }
  h1, h2, h3 { font-family: "Josefin Slab", Georgia, serif; color: var(--navy); font-weight: 700; margin: 0; line-height: 1.2; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--navy); }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }

  .topbalk { background: var(--ijs); font-size: 14px; }
  .topbalk .wrap { display: flex; justify-content: space-between; gap: 16px; padding-top: 8px; padding-bottom: 8px; }
  .topbalk .projectnaam { font-family: "Josefin Slab", Georgia, serif; font-weight: 700; color: var(--navy); }
  .topbalk a { font-family: "Josefin Slab", Georgia, serif; font-weight: 600; text-decoration: none; }
  header.kop { background: var(--wit); box-shadow: 0 2px 14px rgba(20, 42, 91, .08); position: relative; z-index: 2; }
  .kop .wrap { padding-top: 20px; padding-bottom: 20px; }
  .kop img { height: 58px; width: auto; display: block; }

  .voortgang { position: sticky; top: 0; z-index: 10; background: var(--wit); border-bottom: 1px solid var(--line); padding: 12px 0 10px; }
  .voortgang .balk { height: 4px; background: var(--ijs); overflow: hidden; }
  .voortgang .vul { height: 100%; background: var(--navy); width: 0; transition: width .3s ease; }
  .voortgang .tekst { font-size: 14px; color: var(--muted); margin-top: 6px; }

  /* Twee kolommen: vragen + meescrollende samenvatting */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 44px; max-width: 1160px; margin: 0 auto; padding: 36px 16px 72px; }
  .layout.smal { grid-template-columns: minmax(0, 1fr); max-width: 812px; }
  main:focus { outline: none; }
  aside.samenvatting { position: sticky; top: 84px; align-self: start; background: var(--ijs); border-left: 4px solid var(--lichtblauw); padding: 22px 22px 20px; font-size: 16px; }
  aside.samenvatting h3 { font-size: 21px; margin-bottom: 4px; }
  aside.samenvatting dl { margin: 6px 0 0; }
  aside.samenvatting dt { font-family: "Josefin Slab", Georgia, serif; font-weight: 700; color: var(--navy); font-size: 15px; margin-top: 12px; }
  aside.samenvatting dd { margin: 0; color: var(--tekst); word-break: break-word; }
  aside.samenvatting dd.leeg { color: var(--muted); font-style: italic; }
  aside.samenvatting .stappenkop { margin-top: 22px; padding-top: 16px; border-top: 1px solid #C9DDE5; }
  .stappen { list-style: none; padding: 0; margin: 8px 0 0; }
  .stappen li { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 15px; color: var(--muted); }
  .stappen li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #A9B7C2; flex: 0 0 auto; }
  .stappen li.gedaan::before { background: var(--lichtblauw); border-color: var(--lichtblauw); }
  .stappen li.nu { color: var(--navy); font-weight: 700; }
  .stappen li.nu::before { background: var(--navy); border-color: var(--navy); }
  .stappen button { border: 0; background: none; padding: 0; color: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: #A9B7C2; }

  /* Paginakop: ijsblauw vlak met lichtblauwe lijn, zoals op de website */
  .kaart.titel { background: var(--ijs); border-left: 4px solid var(--lichtblauw); padding: 26px 28px; margin-bottom: 8px; }
  .kaart.titel h1 { font-size: 40px; margin-bottom: 16px; }
  .kaart.titel h2 { font-size: 30px; }
  .kaart.titel .uitleg { color: var(--tekst); font-size: 17px; margin-top: 8px; }
  .start { position: relative; padding: 44px 32px 36px; overflow: hidden; margin-bottom: 28px; }
  .label-vlak { position: relative; display: inline-block; margin: 0 0 26px 6px; }
  .label-vlak::before { content: ""; position: absolute; inset: 6px -10px -8px 8px; background: var(--navy); transform: rotate(-3deg) skewX(-6deg); }
  .label-vlak span { position: relative; display: block; background: var(--lichtblauw); color: var(--navy); font-family: "Josefin Slab", Georgia, serif; font-weight: 700; font-size: 17px; padding: 10px 20px; transform: rotate(-2deg); }
  .vertrouwelijk { background: var(--wit); border-left: 4px solid var(--lichtblauw); padding: 16px 20px; font-size: 16px; white-space: pre-line; margin: 20px 0 6px; }

  .kaart { padding: 28px 0; border-bottom: 1px solid var(--line); }
  .kaart.heeft-fout { border-left: 4px solid var(--fout); padding-left: 16px; }
  .uitleg { color: var(--muted); font-size: 16px; margin: 4px 0 0; white-space: pre-line; }
  .alinea { margin: 0 0 14px; white-space: pre-line; }
  .testbanner { background: #FFF4D6; border-left: 4px solid #E0B341; color: #5A4300; padding: 10px 14px; font-size: 15px; margin-bottom: 20px; }
  .melding { padding: 12px 16px; font-size: 16px; margin: 14px 0 0; border-left: 4px solid; }
  .melding.fout { background: var(--fout-bg); color: var(--fout); }
  .melding.info { background: var(--wit); color: var(--navy); border-color: var(--lichtblauw); }

  .vraag { border: 0; margin: 0; padding: 0; min-width: 0; }
  .vraagtitel { font-weight: 700; color: var(--navy); font-size: 19px; padding: 0; display: block; line-height: 1.4; }
  .verplicht { color: var(--magenta); margin-left: 4px; }
  .keuzes { display: grid; gap: 8px; margin-top: 14px; }
  .keuze { display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; background: var(--wit); transition: border-color .15s, background .15s; }
  .keuze:hover { border-color: var(--lichtblauw); background: #F5FAFC; }
  .keuze input { margin: 5px 0 0; accent-color: var(--navy); width: 18px; height: 18px; flex: 0 0 auto; }
  .keuze:has(input:checked) { border-color: var(--navy); background: var(--ijs); color: var(--navy); }
  .keuze span { flex: 1; }
  .anders-tekst { margin-top: 8px; width: 100%; }
  input[type=text], input[type=email], select, textarea { width: 100%; border: 1px solid #A9B7C2; border-radius: 4px; padding: 11px 12px; background: var(--wit); }
  textarea { min-height: 130px; resize: vertical; }
  ::placeholder { color: #8C949C; font-style: italic; opacity: 1; }
  input:focus, select:focus, textarea:focus, .keuze:has(input:focus-visible) { outline: 3px solid var(--lichtblauw); outline-offset: 1px; }
  select { margin-top: 14px; }
  .veld { margin-top: 14px; }
  .duo-blok { border-bottom: 1px solid var(--line); padding-top: 24px; }
  .duo-toelichting { margin: 0; color: var(--tekst); font-size: 17px; }
  .velden-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; align-items: start; }
  .velden-duo .kaart { border-bottom: 0; padding-top: 16px; }

  /* Raster als tabel: zelfde antwoordkolommen voor elke rij */
  .matrix { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 16px; table-layout: fixed; }
  .matrix col.rijkop { width: 34%; }
  .matrix thead th { font-weight: 400; color: var(--navy); font-size: 14px; line-height: 1.3; padding: 0 6px 10px; vertical-align: bottom; text-align: center; border-bottom: 2px solid var(--navy); }
  .matrix tbody tr { border-bottom: 1px solid var(--line); }
  .matrix tbody tr:nth-child(even) { background: var(--zebra); }
  .matrix tbody th { text-align: left; font-weight: 400; color: var(--tekst); padding: 12px 12px 12px 4px; line-height: 1.4; }
  .matrix td { text-align: center; padding: 0; }
  .matrix td label { display: flex; align-items: center; justify-content: center; min-height: 52px; cursor: pointer; }
  .matrix td label:hover { background: rgba(131, 205, 219, .25); }
  .matrix input { width: 20px; height: 20px; accent-color: var(--navy); cursor: pointer; margin: 0; }
  .matrix input:focus-visible { outline: 3px solid var(--lichtblauw); outline-offset: 2px; }
  .matrix tr.ontbreekt { background: var(--fout-bg) !important; }
  .matrix tr.ontbreekt th { color: var(--fout); }
  .matrix .mob { display: none; }

  .foutmelding { color: var(--fout); font-size: 15px; margin-top: 8px; }
  .foutmelding:empty { display: none; }

  /* Knoppen zoals op de website: streepje ervoor */
  .knoppen { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .knoppen .rechts { display: flex; gap: 12px; flex-wrap: wrap; }
  .knop { display: inline-flex; align-items: center; gap: 14px; border: 0; background: transparent; color: var(--navy); font-family: "Josefin Slab", Georgia, serif; font-weight: 700; font-size: 17px; padding: 14px 6px; cursor: pointer; min-height: 48px; border-radius: 4px; }
  .knop::before { content: ""; width: 26px; height: 1px; background: currentColor; transition: width .2s; }
  .knop:hover::before { width: 38px; }
  .knop.hoofd { background: var(--navy); color: var(--wit); padding: 14px 26px; }
  .knop.hoofd:hover { background: var(--navy-2); }
  .knop.rand { border: 1px solid var(--navy); padding: 13px 22px; }
  .knop.link { padding: 6px 0; min-height: auto; font-size: 16px; }
  .knop.link::before { width: 16px; }
  .knop:disabled { opacity: .55; cursor: default; }
  .knop:focus-visible { outline: 3px solid var(--lichtblauw); outline-offset: 2px; }

  .overzicht h3 { font-size: 22px; }
  .overzicht .sectiekop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .overzicht dl { margin: 10px 0 0; }
  .overzicht dt { font-weight: 700; color: var(--navy); font-size: 16px; margin-top: 12px; }
  .overzicht dd { margin: 2px 0 0; white-space: pre-line; }
  .overzicht .leeg { color: var(--muted); font-style: italic; }
  .printkop { display: none; }

  footer { background: var(--navy); color: #DCE6F2; font-size: 15px; }
  footer .wrap { padding-top: 26px; padding-bottom: 30px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer strong { font-family: "Josefin Slab", Georgia, serif; color: var(--wit); font-size: 18px; }
  footer a { color: var(--lichtblauw); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 980px) {
    .layout, .layout.smal { grid-template-columns: minmax(0, 1fr); max-width: 812px; gap: 0; padding-top: 24px; }
    aside.samenvatting { position: static; order: -1; margin-bottom: 20px; padding: 14px 18px; }
    aside.samenvatting .stappenkop, aside.samenvatting .stappen { display: none; }
    aside.samenvatting h3 { font-size: 18px; }
    aside.samenvatting dl { display: flex; flex-wrap: wrap; gap: 0 22px; }
    aside.samenvatting dl > div { margin-top: 6px; }
    aside.samenvatting dt { margin-top: 0; font-size: 13px; }
  }
  @media (max-width: 720px) {
    body { font-size: 17px; }
    .kaart.titel { padding: 20px 18px; }
    .kaart.titel h1 { font-size: 31px; }
    .kaart.titel h2 { font-size: 25px; }
    .start { padding: 32px 18px 26px; }
    .kop img { height: 46px; }
    .topbalk .contact { display: none; }
    .velden-duo { grid-template-columns: 1fr; }
    .knoppen, .knoppen .rechts { flex-direction: column-reverse; align-items: stretch; }
    .knop { justify-content: center; }
    /* Raster op de telefoon: per rij de keuzes onder elkaar */
    .matrix, .matrix tbody, .matrix tr, .matrix th, .matrix td { display: block; width: 100%; }
    .matrix thead, .matrix colgroup { display: none; }
    .matrix tbody tr { padding: 12px 0; background: none !important; }
    .matrix tbody tr.ontbreekt { background: var(--fout-bg) !important; padding-left: 10px; }
    .matrix tbody th { padding: 0 0 6px; font-weight: 700; color: var(--navy); }
    .matrix td { text-align: left; margin-top: 6px; }
    .matrix td label { justify-content: flex-start; gap: 10px; min-height: 0; border: 1px solid #A9B7C2; border-radius: 4px; padding: 8px 12px; }
    .matrix td label:has(input:checked) { border-color: var(--navy); background: var(--ijs); color: var(--navy); }
    .matrix .mob { display: inline; font-size: 15px; }
  }

  @media print {
    .topbalk, header.kop, .voortgang, aside, .knoppen, footer, .testbanner, .noprint { display: none !important; }
    body { font-size: 11pt; color: #222; }
    .layout { display: block; padding: 0; max-width: none; }
    .printkop { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #142A5B; padding-bottom: 10px; margin-bottom: 14px; }
    .printkop img { height: 40px; }
    .printkop div { text-align: right; font-size: 10pt; color: #555; }
    .kaart.titel { background: none; border: 0; padding: 0; }
    .overzicht { break-inside: avoid; padding: 12px 0; }
    .overzicht dd { white-space: pre-line; }
  }
</style>
</head>

const DATA = {"d":{"titel":"Vragenlijst werkzaamheden docenten","inleiding":"Met deze vragenlijst brengen we in beeld welke werkzaamheden docenten binnen VOMEO feitelijk doen, welke verantwoordelijkheden er structureel bij hen liggen en hoeveel ruimte zij hebben om zelf beslissingen te nemen. We vergelijken dat met wat de organisatie van hen verwacht. GOC Consultants voert het onderzoek uit.\n\nGa bij het invullen uit van je gebruikelijke werkzaamheden en verantwoordelijkheden. Kijk daarbij niet uitsluitend naar dit schooljaar, maar naar wat je doorgaans binnen je functie doet. Tijdelijke of incidentele werkzaamheden kun je waar relevant afzonderlijk toelichten.\n\nInvullen kost ongeveer 5 tot 15 minuten.","vertrouwelijkheid":"Noem in je antwoorden ook geen namen van leerlingen of collega's; beschrijf hen met een functie of rol, bijvoorbeeld \"de teamleider\" of \"een collega uit de sectie\".","bevestiging":"Bedankt voor het invullen. Je antwoorden zijn verzonden.\n\nWil je een kopie bewaren? Sla je antwoorden dan op als PDF voordat je deze pagina sluit.","items":[{"type":"kop","titel":"Achtergrond"},{"type":"kort","titel":"Je naam","code":"N1","uitleg":"Niet verplicht.","autocomplete":"name","toelichting":"Het invullen van je naam en e-mailadres is niet verplicht. Vul je ze in, dan kunnen we je eventueel benaderen voor een korte toelichting op je antwoorden. Ook zonder deze gegevens kunnen antwoorden soms indirect herleidbaar zijn, bijvoorbeeld door de combinatie van school, functie en een bijzondere taak, of wanneer een taak door weinig medewerkers wordt uitgevoerd. GOC Consultants behandelt de antwoorden daarom zorgvuldig, gebruikt ze alleen voor het onderzoek naar de docentfuncties en deelt ze niet met anderen."},{"type":"kort","titel":"Je e-mailadres","code":"N2","uitleg":"Niet verplicht.","validatie":"email","autocomplete":"email"},{"type":"mk","titel":"Bij welke school werk je?","code":"A1a","uitleg":"Werk je op meerdere scholen, kies dan de school waar je de meeste uren werkt.","keuzes":["Stad & Esch","CSG Dingstede"],"verplicht":true},{"type":"lijst","titel":"Op welke deelschool of afdeling werk je?","code":"A1","uitleg":"Werk je op meerdere deelscholen of afdelingen, kies dan die waar je de meeste uren werkt.","keuzes":["Stad & Esch Lyceum","Stad & Esch Beroepencollege","Stad & Esch Diever","Stad & Esch Eigen Weg","Stad & Esch Praktijkschool","Stad & Esch De Welkomst / ISK Diever","CSG Dingstede – Mavo","CSG Dingstede – Havo","CSG Dingstede – Vwo"],"verplicht":true,"afhankelijkVan":"A1a","keuzesPer":{"Stad & Esch":["Stad & Esch Lyceum","Stad & Esch Beroepencollege","Stad & Esch Diever","Stad & Esch Eigen Weg","Stad & Esch Praktijkschool","Stad & Esch De Welkomst / ISK Diever"],"CSG Dingstede":["CSG Dingstede – Mavo","CSG Dingstede – Havo","CSG Dingstede – Vwo"]},"meerderePer":{"CSG Dingstede":true},"uitlegPer":{"Stad & Esch":"Werk je op meerdere deelscholen, kies dan die waar je de meeste uren werkt.","CSG Dingstede":"Meerdere antwoorden mogelijk."}},{"type":"cb","titel":"Geef je les in de onderbouw en/of de bovenbouw?","code":"A1b","uitleg":"Meerdere antwoorden mogelijk.","keuzes":["Onderbouw","Bovenbouw"],"verplicht":true},{"type":"mk","titel":"Wat is je huidige functie?","code":"A3","keuzes":["LB","LC","LD","Weet ik niet"],"verplicht":true,"anders":true},{"type":"pagina","titel":"Je eigen onderwijspraktijk","key":"praktijk","uitleg":"Het gaat hier om het werk voor je eigen lessen en leerlingen. Iedereen vult deze sectie in, ook als je naast het lesgeven geen andere taken hebt."},{"type":"raster","titel":"Hoeveel ruimte heb je bij deze onderdelen van je eigen onderwijspraktijk?","code":"A4","uitleg":"Kies per rij wat het best past. Ga uit van de beslissingsruimte en verantwoordelijkheden die bij jouw functie horen, niet uitsluitend van wat je persoonlijk in de praktijk doet.\n\nMet kaders bedoelen we inhoudelijke afspraken en uitgangspunten, zoals onderwijsprogramma's, toetsbeleid, leerdoelen en vastgestelde werkwi   const it = ITEM[code];
  if (!it) return null;
  if (it.type === 'raster') return it.rijen.map((rij, r) => rij + ': ' + (S.a[rijSleutel(it, r)] || '—')).join('\n');
  let w = S.a[it.code];
  if (leeg(w)) return null;
  const anders = 'Anders: ' + (S.a[it.code + '_anders'] || '');
  if (Array.isArray(w)) return w.map(x => x === ANDERS ? anders : x).join(', ');
  return w === ANDERS ? anders : String(w);
}

// ===== Samenvatting aan de zijkant =====
const GEGEVENS = [['Naam', 'N1'], ['Huidige functie', 'A3'], ['School', 'A1'], ['Onder-/bovenbouw', 'A1b']];

function tekenSamenvatting() {
  const zichtbaar = S.scherm === 'vraag' || S.scherm === 'overzicht';
  $aside.hidden = !zichtbaar;
  document.getElementById('layout').classList.toggle('smal', !zichtbaar);
  if (!zichtbaar) return;
  const dl = el('dl');
  GEGEVENS.forEach(([label, code]) => {
    if (!ITEM[code]) return;
    const w = weergave(code);
    dl.append(el('div', {}, el('dt', { text: label }), el('dd', { class: w ? '' : 'leeg', text: w || 'Nog niet ingevuld' })));
  });
  const r = route();
  const pos = S.scherm === 'overzicht' ? r.length : r.indexOf(S.pagina);
  const stappen = el('ol', { class: 'stappen' });
  r.forEach((pi, i) => {
    const naam = PAGINAS[pi].titel;
    const li = el('li', { class: i < pos ? 'gedaan' : i === pos ? 'nu' : '' });
    if (i < pos) li.append(el('button', { type: 'button', text: naam, onclick: () => naar('vraag', pi) }));
    else li.append(i === pos ? el('span', { 'aria-current': 'step', text: naam }) : naam);
    stappen.append(li);
  });
  stappen.append(el('li', { class: S.scherm === 'overzicht' ? 'nu' : '', text: 'Controleren en verzenden' }));
  $aside.replaceChildren(
    el('h3', { text: VERSIE === 'l' ? 'Samenvatting' : 'Jouw samenvatting' }), dl,
    el('h3', { class: 'stappenkop', text: 'Stappen' }), stappen);
}

// ===== Schermen =====
function toonVoortgang() {
  const bar = document.getElementById('voortgang');
  if (S.scherm !== 'vraag' && S.scherm !== 'overzicht') { bar.hidden = true; return; }
  const r = route();
  bar.hidden = false;
  const totaal = r.length + 1;
  const stap = S.scherm === 'overzicht' ? totaal : r.indexOf(S.pagina) + 1;
  const pct = Math.round((stap - 1) / totaal * 100);
  document.getElementById('vul').style.width = pct + '%';
  bar.querySelector('[role=progressbar]').setAttribute('aria-valuenow', pct);
  document.getElementById('stapnaam').textContent = 'Stap ' + stap + ' van ' + totaal + ' · ' + (S.scherm === 'overzicht' ? 'Controleren en verzenden' : PAGINAS[S.pagina].titel);
}

function naar(scherm, pagina) {
  S.scherm = scherm; if (pagina !== undefined) S.pagina = pagina;
  teken();
  window.scrollTo({ top: 0 });
  $app.focus({ preventScroll: true });
}

function teken() {
  $app.replaceChildren();
  if (TEST) $app.append(el('div', { class: 'testbanner', text: 'Testmodus: antwoorden worden als TEST opgeslagen en kunnen weer worden verwijderd.' }));
  if (VERSIE === 'l') document.getElementById('koplabel').textContent = 'Functieanalyse docenten · perspectief leidinggevenden';
  if (S.scherm === 'start') tekenStart();
  else if (S.scherm === 'vraag') tekenPagina();
  else if (S.scherm === 'overzicht') tekenOverzicht();
  else if (S.scherm === 'klaar') tekenKlaar();
  toonVoortgang();
  tekenSamenvatting();
}

function tekenStart() {
  const kaart = el('div', { class: 'kaart titel start' },
    el('div', { class: 'label-vlak' }, el('span', { text: VERSIE === 'l' ? 'Perspectief leidinggevenden' : 'Functieanalyse docenten' })),
    el('h1', { text: V.titel }),
    V.inleiding.split('\n\n').map(p => el('p', { class: 'alinea', text: p })),
    el('div', { class: 'vertrouwelijk', text: V.vertrouwelijkheid }));
  if (openStatus === false && !TEST) kaart.append(el('div', { class: 'melding info', text: 'Deze vragenlijst is nog niet geopend. Je kunt hem bekijken, maar nog niet verzenden.' }));
  kaart.append(
    el('p', { class: 'uitleg', text: 'Je antwoorden worden niet op dit apparaat bewaard. Vul de vragenlijst daarom in één keer in. Aan het eind kun je alles nog controleren en als PDF opslaan.' }),
    el('div', { class: 'knoppen' }, el('button', { class: 'knop hoofd', type: 'button', text: 'Start de vragenlijst', onclick: () => naar('vraag', route()[0]) })));
  $app.append(kaart);
}

function tekenPagina() {
  const r = route();
  if (!r.includes(S.pagina)) S.pagina = r[r.length - 1];
  const pag = PAGINAS[S.pagina];
  $app.append(el('div', { class: 'kaart titel' }, el('h2', { text: pag.titel }), pag.uitleg ? el('p', { class: 'uitleg', text: pag.uitleg }) : null));
  // Naam en e-mail naast elkaar
  const items = pag.items.slice();
  if (items[0] && items[0].code === 'N1' && items[1] && items[1].code === 'N2') {
    const duo = el('div', { class: 'duo-blok' },
      items[0].toelichting ? el('p', { class: 'duo-toelichting', text: items[0].toelichting }) : null,
      el('div', { class: 'velden-duo' }, vraagKaart(items[0]), vraagKaart(items[1])));
    $app.append(duo);
    items.splice(0, 2);
  }
  items.forEach(it => $app.append(vraagKaart(it)));
  const pos = r.indexOf(S.pagina);
  $app.append(el('div', { class: 'knoppen' },
    el('button', { class: 'knop', type: 'button', text: pos === 0 ? 'Terug naar uitleg' : 'Vorige', onclick: () => pos === 0 ? naar('start') : naar('vraag', r[pos - 1]) }),
    el('button', { class: 'knop hoofd', type: 'button', text: 'Volgende', onclick: () => {
      if (!controleer(pag)) return;
      const r2 = route(); const p2 = r2.indexOf(S.pagina);
      if (p2 === r2.length - 1) naar('overzicht'); else naar('vraag', r2[p2 + 1]);
    } })));
}

function printkop() {
  return el('div', { class: 'printkop' }, el('img', { src: LOGO, alt: 'GOC Consultants' }),
    el('div', {}, V.titel, el('br'), 'Ingevuld op ' + new Date().toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' })));
}

function antwoordBlokken(metWijzig) {
  return route().map(pi => {
    const pag = PAGINAS[pi];
    const dl = el('dl');
    pag.items.forEach(it => {
      if (it.naar) return; // vertakkingsvragen niet herhalen
      const w = weergave(it.code);
      dl.append(el('dt', { text: it.titel }), el('dd', { class: w ? '' : 'leeg', text: w || 'Niet ingevuld' }));
    });
    return el('div', { class: 'kaart overzicht' },
      el('div', { class: 'sectiekop' }, el('h3', { text: pag.titel }),
        metWijzig ? el('button', { class: 'knop link', type: 'button', text: 'Wijzigen', 'aria-label': 'Wijzig ' + pag.titel, onclick: () => naar('vraag', pi) }) : null),
      dl);
  });
}

function opslaanAlsPdf() {
  const oud = document.title;
  document.title = 'Antwoorden vragenlijst VOMEO – ' + new Date().toLocaleDateString('nl-NL');
  window.print();
  setTimeout(() => { document.title = oud; }, 1000);
}

function tekenOverzicht() {
  $app.append(printkop(),
    el('div', { class: 'kaart titel' }, el('h2', { text: 'Controleer je antwoorden' }),
      el('p', { class: 'uitleg', text: 'Klopt alles? Je kunt per onderdeel nog iets wijzigen. Daarna verzend je je antwoorden. Wil je een kopie? Sla je antwoorden dan op als PDF.' })),
    ...antwoordBlokken(true));
  const melding = el('div', { 'aria-live': 'polite' });
  const verzend = el('button', { class: 'knop hoofd', type: 'button', text: S.verzonden ? 'Wijzigingen verzenden' : 'Verzenden', onclick: () => verzenden(verzend, melding) });
  const r = route();
  $app.append(el('div', { class: 'knoppen' },
    el('button', { class: 'knop', type: 'button', text: 'Vorige', onclick: () => naar('vraag', r[r.length - 1]) }),
    el('div', { class: 'rechts' }, el('button', { class: 'knop rand', type: 'button', text: 'Opslaan als PDF', onclick: opslaanAlsPdf }), verzend)), melding);
}

async function verzenden(knop, melding) {
  melding.replaceChildren();
  if (!API_URL) { melding.append(el('div', { class: 'melding fout', text: 'Deze pagina is nog niet gekoppeld aan de opslag. Verzenden kan nog niet.' })); return; }
  knop.disabled = true; knop.textContent = 'Bezig met verzenden…';
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ versie: VERSIE, id: S.id, test: TEST, antwoorden: zichtbareAntwoorden() }) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.fout || 'Onbekende fout.');
    S.verzonden = true; S.gewijzigd = false; naar('klaar');
  } catch (e) {
    knop.disabled = false; knop.textContent = S.verzonden ? 'Wijzigingen verzenden' : 'Verzenden';
    melding.append(el('div', { class: 'melding fout', text: 'Verzenden is niet gelukt: ' + e.message + ' Laat deze pagina open en probeer het zo nog eens.' }));
  }
}

function tekenKlaar() {
  $app.append(printkop(), el('div', { class: 'kaart titel' },
    el('h1', { text: 'Bedankt!' }),
    V.bevestiging.split('\n\n').map(p => el('p', { class: 'alinea', text: p })),
    el('div', { class: 'knoppen' },
      el('button', { class: 'knop hoofd', type: 'button', text: 'Opslaan als PDF', onclick: opslaanAlsPdf }),
      el('div', { class: 'rechts' },
        el('button', { class: 'knop', type: 'button', text: 'Antwoorden aanpassen', onclick: () => naar('overzicht') }),
        VERSIE === 'l' ? el('button', { class: 'knop', type: 'button', text: 'Nog een functie invullen', onclick: () => { S = nieuweStaat('vraag'); S.pagina = route()[0]; teken(); } }) : null)),
    el('p', { class: 'uitleg noprint', text: 'Sluit je deze pagina, dan zijn je antwoorden hier niet meer te zien. Ze zijn wel veilig verzonden.' })),
    el('h2', { class: 'noprint', style: 'font-size:24px;margin:28px 0 0', text: 'Je antwoorden' }),
    ...antwoordBlokken(false));
}

// ===== Start =====
teken();
if (API_URL) fetch(API_URL).then(r => r.json()).then(d => { openStatus = !!d.open; if (S.scherm === 'start') teken(); }).catch(() => {});
</script>
